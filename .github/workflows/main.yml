name: Build TWRP for Tab Active 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
          imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python-is-python3 python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Manifest & Sync
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/jimenez15690-dot/twrp_gtactive3.git device/samsung/gtactive3

    - name: Fix Device Tree Makefiles
      run: |
        cd twrp/device/samsung/gtactive3
        sed -i 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' *.mk || true
        sed -i 's|omni_gtactive3|twrp_gtactive3|g' AndroidProducts.mk || true
        sed -i 's|omni_gtactive3|twrp_gtactive3|g' twrp_gtactive3.mk || true

    - name: Build TWRP Recovery
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        
        lunch twrp_gtactive3-eng || lunch omni_gtactive3-eng
        
        # Baut alle potenziellen Image-Targets ab
        mka recoveryimage || mka bootimage || mka vendorbootimage

    - name: Pack Recovery to TAR
      run: |
        cd twrp
        mkdir -p output_images
        
        # Kopiert alle relevanten Ziel-Images aus dem Out-Ordner
        find out/target/product/ -maxdepth 3 -type f -name "*.img" ! -name "ramdisk*" ! -name "userdata*" -exec cp {} output_images/ \;
        
        cd output_images
        echo "=== Gefundene Ziel-Images ==="
        ls -lh
        
        if [ -z "$(ls -A .)" ]; then
          echo "Fehler: Es wurden keine kompatiblen .img-Dateien erzeugt."
          exit 1
        fi
        
        # Erstellt das TAR-Archiv für Odin
        tar -cvf twrp_odin.tar *.img

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_SM-T575_Recovery
        path: twrp/output_images/twrp_odin.tar
