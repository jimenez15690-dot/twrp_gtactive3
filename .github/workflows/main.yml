name: Build TWRP for Tab Active 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
        libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
        libxml2-utils xsltproc unzip fontconfig python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Manifest & Sync
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11.0
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/jimenez15690-dot/twrp_gtactive3.git device/samsung/gtactive3

    - name: Build TWRP Recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_gtactive3-eng
        mka recoveryimage -j$(nproc --all)

    - name: Pack Recovery to TAR
      run: |
        cd twrp/out/target/product/gtactive3/
        tar -cvf recovery.tar recovery.img

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_SM-T575_Recovery
        path: |
          twrp/out/target/product/gtactive3/recovery.img
          twrp/out/target/product/gtactive3/recovery.tar
