name: Build TWRP for Tab Active 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
        libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
        libxml2-utils xsltproc unzip fontconfig python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Manifest & Sync
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/jimenez15690-dot/twrp_gtactive3.git device/samsung/gtactive3

    - name: Patch Device Tree Paths
      run: |
        cd twrp/device/samsung/gtactive3
        sed -i 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' twrp_gtactive3.mk || true
        sed -i 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' AndroidProducts.mk || true

    - name: Build TWRP Recovery
      run: |
        cd twrp
        source build/envsetup.sh
        lunch twrp_gtactive3-eng
        mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Find and Pack Images
      run: |
        cd twrp
        echo "=== Gebaute Dateien im Target-Ordner ==="
        find out/target/product/ -name "*.img"
        
        mkdir -p output_images
        # Kopiert alle erzeugten .img-Dateien (boot.img, recovery.img, vendor_boot.img)
        find out/target/product/ -name "*.img" -exec cp {} output_images/ \;
        
        # Erstellt eine TAR-Datei aus allen gefundenen Images für Odin
        cd output_images
        tar -cvf twrp_odin.tar *.img

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_SM-T575_Build
        path: twrp/output_images/
