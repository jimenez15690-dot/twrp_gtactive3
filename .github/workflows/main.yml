name: Build TWRP for Samsung Tab Active 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    env:
      DEVICE: gtactive3
      PRODUCT: twrp_gtactive3
      BUILD_JOBS: 4

    steps:

      # ============================================================
      # 1. Speicher freigeben
      # ============================================================
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true

      # ============================================================
      # 2. Abhängigkeiten
      # ============================================================
      - name: Install Build Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            bc \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python-is-python3 \
            python3

      # ============================================================
      # 3. Repo Tool
      # ============================================================
      - name: Setup Repo Tool
        run: |
          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          repo --version

      # ============================================================
      # 4. TWRP 11 Source
      # ============================================================
      - name: Initialize TWRP Source
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          mkdir -p twrp
          cd twrp

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11 \
            --depth=1

          repo sync \
            -c \
            -j4 \
            --force-sync \
            --no-clone-bundle \
            --no-tags

      # ============================================================
      # 5. Device Tree
      # ============================================================
      - name: Clone Device Tree
        run: |
          cd twrp

          git clone \
            https://github.com/jimenez15690-dot/twrp_gtactive3.git \
            device/samsung/gtactive3

      # ============================================================
      # 6. Device Tree prüfen
      #
      # WICHTIG:
      # Wir verändern die vorhandenen Makefiles NICHT mehr
      # mit sed. Der originale Device Tree definiert bereits:
      #
      # PRODUCT_DEVICE := gtactive3
      # PRODUCT_NAME   := twrp_gtactive3
      # ============================================================
      - name: Validate Device Tree
        run: |
          cd twrp

          DEVICE_TREE="device/samsung/gtactive3"

          echo "=========================================="
          echo "DEVICE TREE"
          echo "=========================================="

          test -d "$DEVICE_TREE" || {
            echo "ERROR: Device tree fehlt!"
            exit 1
          }

          echo
          echo "=== Dateien ==="
          find "$DEVICE_TREE" -maxdepth 2 -type f | sort

          echo
          echo "=== AndroidProducts.mk ==="
          cat "$DEVICE_TREE/AndroidProducts.mk"

          echo
          echo "=== Product Makefile ==="
          cat "$DEVICE_TREE/twrp_gtactive3.mk"

          echo
          echo "=== BoardConfig.mk ==="
          cat "$DEVICE_TREE/BoardConfig.mk"

          echo
          echo "=== Prüfe PRODUCT_DEVICE ==="

          grep -q \
            'PRODUCT_DEVICE[[:space:]]*:=[[:space:]]*gtactive3' \
            "$DEVICE_TREE/twrp_gtactive3.mk" || {

            echo "ERROR:"
            echo "PRODUCT_DEVICE := gtactive3 fehlt!"
            exit 1
          }

          echo
          echo "PRODUCT_DEVICE korrekt."

          echo
          echo "=== Prüfe PRODUCT_NAME ==="

          grep -q \
            'PRODUCT_NAME[[:space:]]*:=[[:space:]]*twrp_gtactive3' \
            "$DEVICE_TREE/twrp_gtactive3.mk" || {

            echo "ERROR:"
            echo "PRODUCT_NAME := twrp_gtactive3 fehlt!"
            exit 1
          }

          echo
          echo "PRODUCT_NAME korrekt."

      # ============================================================
      # 7. Build Environment
      # ============================================================
      - name: Configure Build Environment
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          echo
          echo "=== Lunch Target ==="

          lunch twrp_gtactive3-eng

          echo
          echo "=========================================="
          echo "BUILD VARIABLES"
          echo "=========================================="

          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "TARGET_ARCH=$TARGET_ARCH"
          echo "TARGET_BOARD_PLATFORM=$TARGET_BOARD_PLATFORM"
          echo "OUT_DIR=$OUT_DIR"

          echo
          echo "=========================================="
          echo "CRITICAL CHECK"
          echo "=========================================="

          if [ "$TARGET_DEVICE" != "gtactive3" ]; then
            echo
            echo "ERROR: TARGET_DEVICE ist NICHT gtactive3!"
            echo "TARGET_DEVICE=$TARGET_DEVICE"
            echo
            echo "Der Build wird absichtlich abgebrochen."
            exit 1
          fi

          if [ "$TARGET_PRODUCT" != "twrp_gtactive3" ]; then
            echo
            echo "ERROR: Falsches TARGET_PRODUCT!"
            echo "TARGET_PRODUCT=$TARGET_PRODUCT"
            exit 1
          fi

          echo
          echo "TARGET_DEVICE korrekt: $TARGET_DEVICE"
          echo "TARGET_PRODUCT korrekt: $TARGET_PRODUCT"

      # ============================================================
      # 8. Vorhandene Kernel/DTB prüfen
      # ============================================================
      - name: Validate Kernel and DTB
        run: |
          cd twrp

          DEVICE_TREE="device/samsung/gtactive3"

          echo "=== Kernel/DTB Dateien ==="

          ls -lh \
            "$DEVICE_TREE/kernel" \
            "$DEVICE_TREE/dtb" \
            2>/dev/null || true

          echo
          echo "=== Kernel ==="

          if [ ! -f "$DEVICE_TREE/kernel" ]; then
            echo "ERROR: $DEVICE_TREE/kernel fehlt!"
            exit 1
          fi

          echo
          echo "Kernel gefunden:"
          ls -lh "$DEVICE_TREE/kernel"

          echo
          echo "=== DTB ==="

          if [ ! -e "$DEVICE_TREE/dtb" ]; then
            echo "ERROR: $DEVICE_TREE/dtb fehlt!"
            exit 1
          fi

          ls -lh "$DEVICE_TREE/dtb"

      # ============================================================
      # 9. Recovery bauen
      #
      # Nur recoveryimage zuerst.
      #
      # Das ist wichtig, weil wir für dieses Gerät zunächst
      # feststellen müssen, welches Image der Device Tree erzeugt.
      # ============================================================
      - name: Build Recovery Image
        run: |
          cd twrp

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_gtactive3-eng

          echo
          echo "=========================================="
          echo "FINAL BUILD TARGET"
          echo "=========================================="

          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"

          if [ "$TARGET_DEVICE" != "gtactive3" ]; then
            echo "ERROR: TARGET_DEVICE ist leer oder falsch."
            exit 1
          fi

          echo
          echo "=========================================="
          echo "BUILDING RECOVERY"
          echo "=========================================="

          mka recoveryimage -j"$BUILD_JOBS"

          echo
          echo "=========================================="
          echo "RECOVERY BUILD FINISHED"
          echo "=========================================="

          echo
          echo "=== Images ==="

          find "out/target/product/$DEVICE" \
            -type f \
            -name "*.img" \
            -print \
            | sort

      # ============================================================
      # 10. Falls recoveryimage nicht existiert:
      # bootimage versuchen
      # ============================================================
      - name: Build Boot Image Fallback
        if: success()
        run: |
          cd twrp

          TARGET_DIR="out/target/product/$DEVICE"

          if find "$TARGET_DIR" -maxdepth 1 -type f -name "recovery.img" | grep -q .; then
            echo "recovery.img wurde erzeugt."
            exit 0
          fi

          echo "Kein recovery.img vorhanden."
          echo "Versuche bootimage..."

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh
          lunch twrp_gtactive3-eng

          mka bootimage -j"$BUILD_JOBS"

      # ============================================================
      # 11. Ergebnis analysieren
      # ============================================================
      - name: Inspect Build Output
        if: always()
        run: |
          cd twrp

          TARGET_DIR="out/target/product/$DEVICE"

          echo
          echo "=========================================="
          echo "FINAL OUTPUT"
          echo "=========================================="

          if [ -d "$TARGET_DIR" ]; then

            echo
            echo "=== Product Directory ==="
            ls -lah "$TARGET_DIR"

            echo
            echo "=== IMG Dateien ==="

            find "$TARGET_DIR" \
              -type f \
              -name "*.img" \
              -exec ls -lh {} \; \
              | sort

            echo
            echo "=== Recovery Directory ==="

            find "$TARGET_DIR/recovery" \
              -maxdepth 3 \
              -type f \
              -print \
              2>/dev/null \
              | sort

          else
            echo "ERROR: Product directory fehlt!"
          fi

      # ============================================================
      # 12. Odin TAR
      # ============================================================
      - name: Pack Odin TAR
        run: |
          cd twrp

          TARGET_DIR="out/target/product/$DEVICE"
          OUTPUT_DIR="$PWD/output_images"

          rm -rf "$OUTPUT_DIR"
          mkdir -p "$OUTPUT_DIR"

          echo "=========================================="
          echo "PACKAGING"
          echo "=========================================="

          # recovery.img bevorzugen
          if [ -f "$TARGET_DIR/recovery.img" ]; then
            cp "$TARGET_DIR/recovery.img" "$OUTPUT_DIR/"
          fi

          # boot.img als Fallback
          if [ -f "$TARGET_DIR/boot.img" ]; then
            cp "$TARGET_DIR/boot.img" "$OUTPUT_DIR/"
          fi

          echo
          echo "=== Images für TAR ==="
          ls -lah "$OUTPUT_DIR" || true

          IMAGE_COUNT=$(find "$OUTPUT_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*.img" \
            | wc -l)

          if [ "$IMAGE_COUNT" -eq 0 ]; then
            echo
            echo "ERROR: Kein flashbares IMG erzeugt."
            echo
            echo "Der Build wird nicht als erfolgreiches TWRP"
            echo "Artifact veröffentlicht."
            exit 1
          fi

          cd "$OUTPUT_DIR"

          tar -cvf twrp_SM-T575_odin.tar *.img

          echo
          echo "=========================================="
          echo "ODIN TAR"
          echo "=========================================="

          ls -lh twrp_SM-T575_odin.tar

          echo
          tar -tvf twrp_SM-T575_odin.tar

      # ============================================================
      # 13. Artifact
      # ============================================================
      - name: Upload TWRP Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_SM-T575_Recovery
          path: twrp/output_images/twrp_SM-T575_odin.tar
          if-no-files-found: error
          retention-days: 30
