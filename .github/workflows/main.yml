name: Build TWRP for Tab Active 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bc build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf \
          imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev \
          libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool \
          squashfs-tools xsltproc zip zlib1g-dev python-is-python3 python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Manifest & Sync
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/jimenez15690-dot/twrp_gtactive3.git device/samsung/gtactive3

    - name: Prepare Makefiles & Lunch Targets
      run: |
        cd twrp/device/samsung/gtactive3
        
        # 1. Omni-Dateiname auf TWRP umbenennen
        if [ -f omni_gtactive3.mk ]; then
          mv omni_gtactive3.mk twrp_gtactive3.mk
        fi
        
        # 2. Omni-Referenzen in allen Makefiles anpassen
        sed -i 's/omni_/twrp_/g' *.mk 2>/dev/null || true
        sed -i 's|vendor/omni/|vendor/twrp/|g' *.mk 2>/dev/null || true
        sed -i 's/PRODUCT_NAME := omni_gtactive3/PRODUCT_NAME := twrp_gtactive3/g' *.mk 2>/dev/null || true
        
        # 3. AndroidProducts.mk sauber für TWRP 11 definieren
        cat << 'EOF' > AndroidProducts.mk
        PRODUCT_MAKEFILES := \
            $(LOCAL_DIR)/twrp_gtactive3.mk

        COMMON_LUNCH_CHOICES := \
            twrp_gtactive3-eng \
            twrp_gtactive3-userdebug
        EOF

    - name: Build TWRP Recovery
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        source build/envsetup.sh
        
        # Target vorbereiten & prüfen
        lunch twrp_gtactive3-eng
        
        # Kompilieren von recoveryimage UND bootimage
        mka recoveryimage bootimage -j$(nproc --all)

    - name: Pack Recovery to TAR
      run: |
        cd twrp
        mkdir -p output_images
        
        TARGET_DIR="out/target/product/gtactive3"
        
        echo "=== Überprüfe Zielordner $TARGET_DIR ==="
        if [ -d "$TARGET_DIR" ]; then
          ls -lh "$TARGET_DIR"/*.img 2>/dev/null || true
          cp "$TARGET_DIR"/*.img output_images/ 2>/dev/null || true
        fi
        
        # Fallback: Durchsuche das gesamte out/-Verzeichnis
        if [ -z "$(ls -A output_images)" ]; then
          echo "Suche im gesamten out/-Ordner nach fertigen Images..."
          find out/ -type f -name "*.img" ! -name "ramdisk*" ! -name "userdata*" ! -name "system*" ! -name "vendor*" -exec cp {} output_images/ \;
        fi

        cd output_images
        echo "=== Gefundene Images für TAR-Archiv ==="
        ls -lh
        
        if [ -z "$(ls -A .)" ]; then
          echo "Fehler: Es wurden keine kompatiblen .img-Dateien erzeugt."
          exit 1
        fi
        
        tar -cvf twrp_odin.tar *.img

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_SM-T575_Recovery
        path: twrp/output_images/twrp_odin.tar
