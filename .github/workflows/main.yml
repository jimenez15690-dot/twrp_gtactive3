name: Build TWRP - Galaxy Tab Active3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev libssl-dev libxml2-utils \
            lzop pngcrush rsync schedtool squashfs-tools xsltproc \
            zip zlib1g-dev python3 python-is-python3

      - name: Setup repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize TWRP source
        run: |
          mkdir -p "$GITHUB_WORKSPACE/twrp"
          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-11 \
            --depth=1

          repo sync -c -j"$(nproc --all)" --force-sync --no-clone-bundle --no-tags

      - name: Clone Galaxy Tab Active3 device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          rm -rf device/samsung/gtactive3
          git clone --depth=1 \
            https://github.com/jimenez15690-dot/twrp_gtactive3.git \
            device/samsung/gtactive3

      - name: Prepare device tree
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          echo "=== Device tree ==="
          find device/samsung/gtactive3 -maxdepth 2 -type f | sort

          if [ -f device/samsung/gtactive3/omni_gtactive3.mk ] && \
             [ ! -f device/samsung/gtactive3/twrp_gtactive3.mk ]; then
            cp device/samsung/gtactive3/omni_gtactive3.mk \
               device/samsung/gtactive3/twrp_gtactive3.mk
            sed -i 's/PRODUCT_NAME := omni_gtactive3/PRODUCT_NAME := twrp_gtactive3/' \
              device/samsung/gtactive3/twrp_gtactive3.mk
          fi

          test -f device/samsung/gtactive3/twrp_gtactive3.mk

          cat > device/samsung/gtactive3/AndroidProducts.mk <<'EOF'
          LOCAL_DIR := $(call my-dir)

          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_gtactive3.mk

          COMMON_LUNCH_CHOICES := \
              twrp_gtactive3-eng \
              twrp_gtactive3-userdebug
          EOF

          cat >> device/samsung/gtactive3/BoardConfig.mk <<'EOF'

          # CI build fixes
          TARGET_NO_RECOVERY := false
          BOARD_USES_RECOVERY_AS_BOOT := false
          EOF

          grep -q 'PRODUCT_DEVICE' device/samsung/gtactive3/twrp_gtactive3.mk || \
            cat >> device/samsung/gtactive3/twrp_gtactive3.mk <<'EOF'

          PRODUCT_DEVICE := gtactive3
          PRODUCT_NAME := twrp_gtactive3
          PRODUCT_MODEL := Galaxy Tab Active3
          PRODUCT_BRAND := samsung
          PRODUCT_MANUFACTURER := samsung
          EOF

          echo "=== AndroidProducts.mk ==="
          cat device/samsung/gtactive3/AndroidProducts.mk

          echo "=== Product makefile ==="
          cat device/samsung/gtactive3/twrp_gtactive3.mk

          echo "=== Recovery settings ==="
          tail -20 device/samsung/gtactive3/BoardConfig.mk

      - name: Prepare build environment
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh

          lunch twrp_gtactive3-eng

          export TARGET_DEVICE=gtactive3

          echo "=== Build variables ==="
          echo "TARGET_DEVICE=$TARGET_DEVICE"
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_BUILD_VARIANT=$TARGET_BUILD_VARIANT"
          echo "PRODUCT_DEVICE=$(get_build_var PRODUCT_DEVICE)"
          echo "PRODUCT_NAME=$(get_build_var PRODUCT_NAME)"
          echo "TARGET_DEVICE_VAR=$(get_build_var TARGET_DEVICE)"
          echo "TARGET_NO_RECOVERY=$(get_build_var TARGET_NO_RECOVERY)"
          echo "BOARD_USES_RECOVERY_AS_BOOT=$(get_build_var BOARD_USES_RECOVERY_AS_BOOT)"
          echo "RECOVERY_VARIANT=$(get_build_var RECOVERY_VARIANT)"
          echo "TARGET_ARCH=$(get_build_var TARGET_ARCH)"

          test "$(get_build_var PRODUCT_DEVICE)" = "gtactive3"
          test "$(get_build_var PRODUCT_NAME)" = "twrp_gtactive3"
          test "$(get_build_var TARGET_NO_RECOVERY)" != "true"

      - name: Build TWRP recovery image
        run: |
          cd "$GITHUB_WORKSPACE/twrp"
          source build/envsetup.sh
          lunch twrp_gtactive3-eng
          export TARGET_DEVICE=gtactive3

          rm -rf out/target/product/gtactive3/recovery.img
          rm -rf out/target/product/gtactive3/boot.img
          rm -rf out/target/product/gtactive3/vendor_boot.img

          echo "=== Available recovery/boot targets ==="
          ninja -C out/soong -t targets all 2>/dev/null | \
            grep -E '(^|/)(recoveryimage|bootimage|recovery\.img|boot\.img)' | head -100 || true

          echo "=== Building recoveryimage ==="
          mka -j"$(nproc --all)" recoveryimage

          echo "=== Output directory ==="
          find out/target/product/gtactive3 -maxdepth 2 -type f \
            \( -name '*.img' -o -name '*.bin' \) -print | sort

          if [ ! -f out/target/product/gtactive3/recovery.img ]; then
            echo "::error::recovery.img was not generated."
            echo "=== Relevant build variables ==="
            get_build_var TARGET_DEVICE || true
            get_build_var PRODUCT_DEVICE || true
            get_build_var PRODUCT_NAME || true
            get_build_var TARGET_NO_RECOVERY || true
            get_build_var BOARD_USES_RECOVERY_AS_BOOT || true
            exit 1
          fi

      - name: Pack recovery image
        run: |
          cd "$GITHUB_WORKSPACE/twrp"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp out/target/product/gtactive3/recovery.img \
             "$GITHUB_WORKSPACE/artifacts/twrp-gtactive3-recovery.img"

          tar -cvf "$GITHUB_WORKSPACE/artifacts/twrp-gtactive3.tar" \
            -C "$GITHUB_WORKSPACE/artifacts" \
            twrp-gtactive3-recovery.img

          sha256sum "$GITHUB_WORKSPACE/artifacts/"*

      - name: Upload TWRP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-gtactive3
          path: artifacts/
          if-no-files-found: error
