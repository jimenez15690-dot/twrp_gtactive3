name: Build TWRP for Tab Active 3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true

    - name: Install Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib \
        libc6-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
        libxml2-utils xsltproc unzip fontconfig python3

    - name: Setup Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Manifest & Sync
      run: |
        mkdir twrp
        cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp
        git clone https://github.com/jimenez15690-dot/twrp_gtactive3.git device/samsung/gtactive3

    - name: Fix Device Tree Makefiles
      run: |
        cd twrp/device/samsung/gtactive3
        sed -i 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' *.mk || true
        sed -i 's|omni_gtactive3|twrp_gtactive3|g' AndroidProducts.mk || true
        sed -i 's|omni_gtactive3|twrp_gtactive3|g' twrp_gtactive3.mk || true

    - name: Build TWRP Recovery (Strict Mode)
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        # Target explizit setzen
        lunch twrp_gtactive3-eng
        
        # Baut genau das Recovery-Image und bricht bei Fehlern sofort ab
        mka recoveryimage

    - name: Pack Recovery to TAR
      run: |
        cd twrp
        mkdir -p output_images
        
        find out/target/product/ -type f -name "*.img" -exec cp {} output_images/ \;
        
        cd output_images
        echo "=== Gebaute Images ==="
        ls -lh
        
        if [ -z "$(ls -A .)" ]; then
          echo "Fehler: Keine Image-Datei generiert."
          exit 1
        fi
        
        tar -cvf twrp_odin.tar *.img

    - name: Upload Recovery Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_SM-T575_Recovery
        path: twrp/output_images/twrp_odin.tar
